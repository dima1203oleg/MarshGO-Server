name: Ukraine route acceptance
on:
  pull_request:
    paths:
      - '.github/workflows/lviv-live-transit-acceptance.yml'
  workflow_dispatch:
    inputs:
      scope:
        description: Route acceptance scenario
        type: choice
        required: true
        default: lviv-route
        options:
          - lviv-route
          - lviv-budget-diagnostic
          - lviv-north-baseline-diagnostic
          - lviv-north-trip-fairness-diagnostic
          - lviv-north-final-arrival-diagnostic
          - ukraine-rail-route
permissions:
  contents: read
concurrency:
  group: lviv-live-transit-acceptance
  cancel-in-progress: false
jobs:
  validate-workflow:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Parse workflow YAML
        run: ruby -e 'require "yaml"; YAML.load_file(".github/workflows/lviv-live-transit-acceptance.yml")'

  route-acceptance:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.21.0
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Run selected read-only route acceptance
        env:
          ROUTE_SCOPE: ${{ inputs.scope || 'lviv-route' }}
        run: |
          set -euo pipefail
          mkdir -p artifacts
          if [[ "$ROUTE_SCOPE" == 'lviv-budget-diagnostic' || "$ROUTE_SCOPE" == 'lviv-north-trip-fairness-diagnostic' || "$ROUTE_SCOPE" == 'lviv-north-final-arrival-diagnostic' ]]; then
            CI=true NODE_ENV=test MARSHGO_ENABLE_GTFS_GRAPH_BUDGET_DIAGNOSTICS=1 npm exec -- tsx scripts/transport-feed-smoke.ts --scope="$ROUTE_SCOPE" | tee artifacts/route-acceptance.json
          else
            npm exec -- tsx scripts/transport-feed-smoke.ts --scope="$ROUTE_SCOPE" | tee artifacts/route-acceptance.json
          fi
      - name: Write run provenance
        if: always()
        run: |
          {
            echo '# Ukraine route acceptance'
            echo "- Server SHA: \`${GITHUB_SHA}\`"
            echo "- Workflow run: \`${GITHUB_RUN_ID}\`"
            echo "- Probe scope: \`${{ inputs.scope || 'lviv-route' }}\`"
            echo '- Database writes: none'
            echo '- User-origin/destination data: none'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Preserve JSON evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: route-acceptance-${{ inputs.scope || 'lviv-route' }}-${{ github.sha }}
          path: artifacts/route-acceptance.json
          if-no-files-found: warn
          retention-days: 14
