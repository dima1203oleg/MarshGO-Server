name: Server CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:17-3.5
        env:
          POSTGRES_DB: marshgo_e2e
          POSTGRES_USER: marshgo
          POSTGRES_PASSWORD: local_only_change_me
        ports: ['5434:5432']
        options: >-
          --health-cmd "pg_isready -U marshgo -d marshgo_e2e"
          --health-interval 5s --health-timeout 3s --health-retries 20
      redis:
        image: redis:7.4-alpine
        ports: ['6380:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      API_TEST_DATABASE_URL: postgres://marshgo:local_only_change_me@127.0.0.1:5434/marshgo_e2e
      REDIS_URL: redis://127.0.0.1:6380
      SESSION_SECRET: test-only-marshgo-ci-session-secret-32chars
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.21.0
          cache: npm
      - run: npm ci
      - run: npm audit --audit-level=high
      - run: npm run lint:all
      - run: npm run typecheck
      - run: npm test
      - run: DATABASE_URL="$API_TEST_DATABASE_URL" npm run db:migrate
      - name: Verify proposal acceptance revision transaction
        run: npm exec -- tsx --test tests/proposal-accept-revision-postgres.integration.test.ts
        env:
          PROPOSAL_ACCEPTANCE_TEST_DATABASE_URL: ${{ env.API_TEST_DATABASE_URL }}
      - name: Verify carpool fare_basis group total transaction
        run: npm exec -- tsx --test tests/carpool-fare-basis-postgres.integration.test.ts
        env:
          FARE_BASIS_TEST_DATABASE_URL: ${{ env.API_TEST_DATABASE_URL }}
      - name: Verify carpool route-bound ordinal transaction
        run: npm exec -- tsx --test tests/carpool-route-ordinals-postgres.integration.test.ts
        env:
          ROUTE_ORDINALS_TEST_DATABASE_URL: ${{ env.API_TEST_DATABASE_URL }}
      - run: npm run test:integration
      - name: Build production API image
        run: docker build --tag marshgo-server:ci .
      - name: Smoke-test API image with local PostGIS and Redis
        env:
          DATABASE_URL: ${{ env.API_TEST_DATABASE_URL }}
          IMAGE_SMOKE_SESSION_SECRET: local-container-smoke-session-secret-32chars
        run: |
          docker run --detach --name marshgo-api-image-smoke --network host \
            --env NODE_ENV=development --env API_HOST=0.0.0.0 --env API_PORT=3002 \
            --env TRUST_PROXY_HOPS=0 --env AUTH_DEV_BYPASS=true --env AUTH_DEV_OTP=true \
            --env SESSION_SECRET="$IMAGE_SMOKE_SESSION_SECRET" --env DATABASE_URL="$DATABASE_URL" \
            --env REDIS_URL="$REDIS_URL" --env MOBILITY_HEALTH_DISABLED=true marshgo-server:ci
          trap 'docker rm --force marshgo-api-image-smoke >/dev/null 2>&1 || true' EXIT
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:3002/readyz >/dev/null; then break; fi
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:3002/readyz
      - name: Exercise local API Compose lifecycle end-to-end
        run: |
          set -euo pipefail
          # CI runtime contract for scripts/local-api.sh + docker-compose.local-api.yml.
          # Isolated stack ports must never collide with the CI service ports
          # (postgres 5434, redis 6380) or the previous image smoke port (3002).
          stack_db_port=5444
          stack_redis_port=6390
          stack_api_port=3012
          for reserved in 5434 6380 3002; do
            for chosen in "$stack_db_port" "$stack_redis_port" "$stack_api_port"; do
              if [ "$chosen" = "$reserved" ]; then
                echo "local-api CI: stack port $chosen collides with reserved CI port $reserved" >&2
                exit 1
              fi
            done
          done
          # Disposable secrets: generated inside the runner, never printed,
          # written to the gitignored env file with owner-only permissions.
          umask 077
          db_password="$(openssl rand -hex 16)"
          session_secret="$(openssl rand -hex 32)"
          {
            printf 'LOCAL_API_POSTGRES_PASSWORD=%s\n' "$db_password"
            printf 'LOCAL_API_SESSION_SECRET=%s\n' "$session_secret"
            printf 'LOCAL_API_DB_PORT=%s\n' "$stack_db_port"
            printf 'LOCAL_API_REDIS_PORT=%s\n' "$stack_redis_port"
            printf 'LOCAL_API_PORT=%s\n' "$stack_api_port"
            printf 'LOCAL_API_TRUST_PROXY_HOPS=0\n'
          } > .env.local-api
          unset db_password session_secret
          # Always tear down (containers/network only, volumes preserved, never
          # -v) and re-exit with the original status so start/smoke failures
          # are never masked by cleanup.
          cleanup() {
            local status=$?
            npm run local:api:down || echo "local-api CI: cleanup down failed" >&2
            rm -f .env.local-api
            exit "$status"
          }
          trap cleanup EXIT
          npm run local:api:start
          npm run local:api:smoke
          echo "local-api CI: lifecycle OK on 127.0.0.1:$stack_api_port (start + exact-SHA smoke)"
