name: Server CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:17-3.5
        env:
          POSTGRES_DB: marshgo_e2e
          POSTGRES_USER: marshgo
          POSTGRES_PASSWORD: local_only_change_me
        ports: ['5434:5432']
        options: >-
          --health-cmd "pg_isready -U marshgo -d marshgo_e2e"
          --health-interval 5s --health-timeout 3s --health-retries 20
      redis:
        image: redis:7.4-alpine
        ports: ['6380:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      API_TEST_DATABASE_URL: postgres://marshgo:local_only_change_me@127.0.0.1:5434/marshgo_e2e
      REDIS_URL: redis://127.0.0.1:6380
      SESSION_SECRET: test-only-marshgo-ci-session-secret-32chars
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.21.0
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: DATABASE_URL="$API_TEST_DATABASE_URL" npm run db:migrate
      - run: npm run test:integration
